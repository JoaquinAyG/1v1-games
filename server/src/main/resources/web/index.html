<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game server test chat</title>
  <style>
    body { font-family: sans-serif; max-width: 520px; margin: 1rem auto; padding: 0 1rem; }
    #log { border: 1px solid #ccc; height: 320px; overflow-y: auto; padding: .5rem; margin: .5rem 0; }
    .system { color: #888; font-style: italic; }
    form { display: flex; gap: .5rem; }
    input { flex: 1; padding: .4rem; }
  </style>
</head>
<body>
  <h3>Test chat</h3>
  <form id="join"><input id="name" placeholder="Your name" required><input id="room" placeholder="Room code" required><button>Join</button><button type="button" id="host">Host</button></form>
  <div id="log"></div>
  <form id="send"><input id="text" placeholder="Message" autocomplete="off" disabled><button disabled>Send</button></form>
  <script>
    const log = document.getElementById('log');
    const add = (cls, t) => { const d = document.createElement('div'); d.className = cls; d.textContent = t; log.append(d); log.scrollTop = log.scrollHeight; };
    let ws;
    document.getElementById('join').onsubmit = e => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const room = document.getElementById('room').value.trim();
      ws = new WebSocket(`ws://${location.host}/ws?name=${encodeURIComponent(name)}&room=${encodeURIComponent(room)}`);
      ws.onopen = () => document.querySelectorAll('#send input, #send button').forEach(el => el.disabled = false);
      ws.onmessage = ev => { const m = JSON.parse(ev.data); add(m.type, m.type === 'chat' ? `${m.from}: ${m.text}` : m.text); };
      ws.onclose = ev => { add('system', `Disconnected${ev.reason ? ': ' + ev.reason : ''}`); document.querySelectorAll('#send input, #send button').forEach(el => el.disabled = true); };
    };
    document.getElementById('host').onclick = async () => {
      document.getElementById('room').value = await (await fetch('/rooms/new')).text();
      if (document.getElementById('name').value.trim()) document.getElementById('join').requestSubmit();
    };
    document.getElementById('send').onsubmit = e => {
      e.preventDefault();
      const t = document.getElementById('text');
      if (!t.value.trim()) return;
      ws.send(JSON.stringify({ text: t.value }));
      add('chat', `me: ${t.value}`);
      t.value = '';
    };
  </script>
</body>
</html>
